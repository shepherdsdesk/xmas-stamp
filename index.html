<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b2e">
  <title>성탄 말씀 스탬프 여정</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 불러오는 중 -->
  <section id="v-loading" class="loading">불러오는 중입니다</section>

  <!-- 처음: 이름과 번호 -->
  <section id="v-start" hidden>
    <div class="wrap">
      <div class="hero" style="background-image:url(img/church.jpg)"></div>
      <div class="stack">
        <div class="stack-8">
          <p class="label" id="s-church"></p>
          <h1 id="s-title"></h1>
          <p class="muted" id="s-sub"></p>
        </div>
        <div class="card stack-8">
          <p>교회 안 <b id="s-count">다섯</b> 곳에서 스탬프를 받으며 성탄 말씀을 묵상합니다.</p>
          <p class="muted small">장소 안내판의 숫자 4자리를 넣거나, 휴대폰 카메라로 QR을 찍으면 스탬프가 찍힙니다. 순서는 상관없습니다.</p>
        </div>
        <p class="notice" id="s-qrnote" hidden>이름과 번호를 넣으시면 이 장소 스탬프가 바로 찍힙니다.</p>
        <form id="f-start" class="stack" novalidate>
          <div class="field"><label for="i-name">이름</label>
            <input id="i-name" class="input" autocomplete="name" maxlength="20" placeholder="홍길동"></div>
          <div class="field"><label for="i-phone">휴대폰 번호</label>
            <input id="i-phone" class="input" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-0000-0000"></div>
          <label class="check"><input type="checkbox" id="i-agree">
            <span><b>개인정보 수집·이용에 동의합니다</b><br><span class="muted small" id="s-agree"></span></span></label>
          <p class="err" id="e-start" role="alert"></p>
          <button class="btn" type="submit" id="b-start">시작하기</button>
          <p class="muted small center">전에 참여하셨다면 같은 이름과 번호를 넣으십시오. 기록이 이어집니다.</p>
        </form>
      </div>
    </div>
  </section>

  <!-- 내 스탬프 -->
  <section id="v-home" hidden>
    <div class="wrap with-dock stack" id="home"></div>
    <div class="dock" id="dock"><button class="btn" id="b-stamp" type="button">스탬프 찍기</button></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
