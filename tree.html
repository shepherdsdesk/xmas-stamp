<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로비 성탄 트리 · 성탄 말씀 스탬프 여정</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    :root { --gold: #f3cf7a; --gold-bright: #ffe39e; --ink: #f7f2e6; --muted: #c5cddb; --soft: #93a0b8; --serif: "AppleMyungjo", "Noto Serif KR", "Nanum Myeongjo", serif; }
    .eyebrow { color: var(--gold); font-weight: 700; }

    /* ===== 로비 TV용 디지털 성탄 트리 (가로 화면 기준, vw/vh 단위) ===== */
    html, body { height: 100%; }
    body { overflow: hidden; background: radial-gradient(ellipse at 50% 28%, #1f3456 0%, #0e1726 55%, #060b16 100%); background-attachment: fixed; }
    .tv { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
    .sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .6; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .9; } }

    .tv-head { position: absolute; top: 3vh; left: 0; right: 0; text-align: center; z-index: 3; }
    .tv-head .eyebrow { font-size: max(18px, 1.5vw); margin: 0; }
    .tv-head h1 { font-family: var(--serif); font-size: max(28px, 3.4vw); color: var(--gold-bright); margin: .2vh 0 0;
      text-shadow: 0 0 2vw rgba(243,207,122,.35); }

    .tree-wrap { position: absolute; left: 50%; bottom: 11vh; height: 74vh; aspect-ratio: 600 / 820; transform: translateX(-50%); z-index: 2; }
    .tree-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .tree-star { transform-origin: 300px 80px; animation: starSpin 24s linear infinite; }
    @keyframes starSpin { to { transform: rotate(360deg); } }
    .tree-glow { animation: glow 3.4s ease-in-out infinite; transform-origin: 300px 80px; }
    @keyframes glow { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.15); } }
    .bulb { opacity: .18; transition: opacity 1.2s; }
    .bulb.lit { opacity: 1; animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .garland { stroke-dasharray: 6 10; animation: dash 6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -160; } }

    .slot { position: absolute; z-index: 4; width: 23vw; max-width: 440px; }
    .orn { position: relative; padding: 1.3vw 1.5vw 1.3vw 4.6vw; border-radius: 1.6vw;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      border: 1px solid rgba(243,207,122,.35); box-shadow: 0 1vw 2.4vw rgba(0,0,0,.35);
      font-size: max(18px, 1.55vw); line-height: 1.5; color: var(--ink);
      opacity: 0; transform: translateY(1.5vh) scale(.96); transition: opacity 1.1s ease, transform 1.1s ease; }
    .orn.show { opacity: 1; transform: none; }
    .orn.new { box-shadow: 0 0 0 2px rgba(243,207,122,.8), 0 0 3vw rgba(243,207,122,.45); }
    .orn .ico { position: absolute; left: 1.2vw; top: 1.3vw; width: 2.6vw; height: 2.6vw; animation: spinSlow 14s linear infinite; }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    .orn .tag { display: inline-block; font-size: max(14px, 1vw); font-weight: 800; padding: .1vw .8vw; border-radius: 99px; margin-bottom: .4vw;
      background: rgba(0,0,0,.25); color: var(--muted); }
    .slot .float { animation: float 7s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-1.2vh) rotate(.6deg); } }

    .ticker { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; text-align: center; padding: 2.2vh 2vw;
      background: linear-gradient(180deg, rgba(6,11,22,0), rgba(6,11,22,.85) 40%); font-size: max(20px, 2.1vw); font-weight: 800; }
    .ticker b { color: var(--gold-bright); font-size: 1.25em; }
    .flake { position: absolute; top: -2vh; color: #fff; opacity: .75; pointer-events: none; z-index: 1; animation: fall linear infinite; }
    @keyframes fall { to { transform: translate3d(3vw, 106vh, 0); } }
    #fs { position: fixed; right: 14px; top: 14px; z-index: 9; background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3);
      border-radius: 10px; padding: 10px 16px; font-size: 18px; cursor: pointer; }
    .offline { position: fixed; left: 14px; top: 14px; z-index: 9; font-size: 16px; color: var(--soft); }
  
  </style>
</head>
<body>
  <div class="tv">
    <div class="sky" id="sky"></div>
    <div id="snow"></div>
    <div class="tv-head">
      <div class="eyebrow" id="h-sub">성탄 말씀 스탬프 여정</div>
      <h1 id="h-title">별을 따라 베들레헴으로</h1>
    </div>

    <div class="tree-wrap">
      <svg viewBox="0 0 600 820" aria-label="성탄 트리">
        <defs>
          <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a7553"/><stop offset="1" stop-color="#123a2b"/>
          </linearGradient>
          <radialGradient id="halo"><stop offset="0" stop-color="rgba(255,236,170,.9)"/><stop offset="1" stop-color="rgba(255,236,170,0)"/></radialGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c9"/><stop offset="1" stop-color="#d9a640"/></linearGradient>
        </defs>
        <circle class="tree-glow" cx="300" cy="80" r="95" fill="url(#halo)"/>
        <polygon points="300,120 170,330 430,330" fill="url(#leaf)" stroke="#0b2a1e" stroke-width="2"/>
        <polygon points="300,230 120,500 480,500" fill="url(#leaf)" stroke="#0b2a1e" stroke-width="2"/>
        <polygon points="300,360 70,680 530,680" fill="url(#leaf)" stroke="#0b2a1e" stroke-width="2"/>
        <path class="garland" d="M205 290 Q300 340 400 280" fill="none" stroke="#f3cf7a" stroke-width="5" stroke-linecap="round"/>
        <path class="garland" d="M160 450 Q300 520 440 430" fill="none" stroke="#f3cf7a" stroke-width="5" stroke-linecap="round"/>
        <path class="garland" d="M110 630 Q300 710 490 600" fill="none" stroke="#f3cf7a" stroke-width="5" stroke-linecap="round"/>
        <rect x="270" y="680" width="60" height="70" rx="6" fill="#5b3a26"/>
        <rect x="150" y="700" width="90" height="70" rx="6" fill="#7a3b2e"/><rect x="190" y="700" width="12" height="70" fill="#f3cf7a"/>
        <rect x="360" y="710" width="80" height="60" rx="6" fill="#2c4a7a"/><rect x="394" y="710" width="12" height="60" fill="#f3cf7a"/>
        <g id="bulbs"></g>
        <g class="tree-star">
          <path d="M300 18 L316 62 L363 63 L326 91 L340 136 L300 110 L260 136 L274 91 L237 63 L284 62 Z" fill="url(#gold)" stroke="#fff6d6" stroke-width="2" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>

    
    <div id="slots"></div>
    <div class="ticker" id="ticker">지금까지 <b id="cnt">0</b>명이 별 여정을 마치셨습니다. 주님 오심을 함께 기뻐합니다.</div>
    <div class="offline" id="offline" hidden>연결을 확인하는 중입니다</div>
  </div>
  <button id="fs" type="button">전체 화면</button>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
  (function () {
    var THEMES = {};
    var COLORS = ['#a9cbff', '#ffb8c6', '#ffe39e', '#b8e6c9', '#f3cf7a'];
    // 트리를 피해 좌우에 4개씩 배치 (좌표는 화면 비율)
    var SLOT_POS = [
      { l: 3, t: 16 }, { l: 6, t: 35 }, { l: 2, t: 54 }, { l: 6, t: 71 },
      { r: 3, t: 14 }, { r: 6, t: 33 }, { r: 2, t: 52 }, { r: 6, t: 69 }
    ];
    var IDLE = [
      '팜플렛의 QR을 찍고 별 여정에 함께하십시오',
      '교회 곳곳의 안내판에서 별 스탬프를 받으십시오',
      '모든 별을 모으면 성탄 표어가 완성됩니다',
      '우리에게 한 아기가 나셨으니 그의 이름은 임마누엘이라',
      '스탬프를 받고 남긴 한 줄 나눔이 이 트리에 별로 걸립니다',
      '완주하신 분은 12월 19일 교구 모임 후 선물을 받으십니다',
      '주님 오심을 기뻐하는 복된 성탄 되십시오'
    ];
    var items = [], seen = {}, queue = [], cursor = 0, idleCursor = 0, slotTurn = 0, slots = [], shown = [], firstLoad = true;

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function starIco(color) {
      return '<svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L61 37 L96 38 L68 59 L78 93 L50 73 L22 93 L32 59 L4 38 L39 37 Z" fill="' + color + '"/></svg>';
    }

    /* 배경 별과 눈 */
    (function decorate() {
      var sky = document.getElementById('sky'), html = '';
      for (var i = 0; i < 70; i++) {
        html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 60).toFixed(1) + '%;animation-delay:' + (Math.random() * 3).toFixed(1) + 's"></i>';
      }
      sky.innerHTML = html;
      var snow = document.getElementById('snow'), s = '';
      for (var j = 0; j < 40; j++) {
        s += '<span class="flake" style="left:' + (Math.random() * 100).toFixed(1) + '%;font-size:' + (8 + Math.random() * 14).toFixed(0) + 'px;animation-duration:' +
          (12 + Math.random() * 14).toFixed(1) + 's;animation-delay:-' + (Math.random() * 20).toFixed(1) + 's">❄</span>';
      }
      snow.innerHTML = s;
      // 트리 전구 40개 (나눔이 늘어날수록 하나씩 켜짐)
      var g = document.getElementById('bulbs'), b = '', n = 0;
      var tiers = [[120, 330, 170, 430], [230, 500, 120, 480], [360, 680, 70, 530]];
      for (var t = 0; t < tiers.length; t++) {
        var rows = t === 0 ? 3 : 4;
        for (var r = 0; r < rows; r++) {
          var y = tiers[t][0] + 60 + r * ((tiers[t][1] - tiers[t][0] - 70) / rows);
          var half = (y - tiers[t][0]) / (tiers[t][1] - tiers[t][0]) * ((tiers[t][3] - tiers[t][2]) / 2) - 18;
          var count = Math.max(2, Math.round(half / 40));
          for (var c = 0; c < count && n < 40; c++) {
            var x = 300 - half + (2 * half) * (c + 0.5) / count;
            b += '<circle class="bulb" id="bulb' + n + '" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="9" fill="' + COLORS[n % 5] +
              '" style="animation-delay:' + (n * 0.17 % 2.6).toFixed(2) + 's"/>';
            n++;
          }
        }
      }
      g.innerHTML = b;
    })();

    function buildSlots() {
      var root = document.getElementById('slots');
      root.innerHTML = SLOT_POS.map(function (p, i) {
        var pos = (p.l != null ? 'left:' + p.l + 'vw;' : 'right:' + p.r + 'vw;') + 'top:' + p.t + 'vh;';
        return '<div class="slot" style="' + pos + '"><div class="float" style="animation-delay:-' + (i * 0.9) + 's"><div class="orn" id="orn' + i + '"></div></div></div>';
      }).join('');
      slots = SLOT_POS.map(function (_, i) { return document.getElementById('orn' + i); });
    }

    function ornHtml(it) {
      if (!it) return '';
      if (it.idle) return starIco('#f3cf7a') + '<div>' + esc(it.text) + '</div>';
      var i = Math.max(0, (it.loc || 1) - 1) % COLORS.length;
      return starIco(COLORS[i]) + (THEMES[it.loc] ? '<span class="tag">' + esc(THEMES[it.loc]) + '</span>' : '') + '<div>' + esc(it.text) + '</div>';
    }

    function setSlot(i, it, isNew) {
      var el = slots[i];
      shown[i] = it && it.id;
      el.classList.remove('show');
      setTimeout(function () {
        el.innerHTML = ornHtml(it);
        el.classList.toggle('new', !!isNew);
        el.classList.add('show');
        if (isNew) setTimeout(function () { el.classList.remove('new'); }, 9000);
      }, 900);
    }

    // 같은 나눔이 두 자리에 동시에 뜨지 않도록, 지금 보이는 글은 건너뜀
    function nextItem(slotIdx) {
      if (queue.length) return { it: queue.shift(), isNew: true };
      for (var tries = 0; tries < items.length; tries++) {
        var it = items[cursor++ % items.length];
        var busy = shown.some(function (id, i) { return i !== slotIdx && id === it.id; });
        if (!busy) return { it: it, isNew: false };
      }
      return { it: { idle: true, id: 'idle' + idleCursor, text: IDLE[idleCursor++ % IDLE.length] }, isNew: false };
    }

    function fillAll() {
      for (var i = 0; i < slots.length; i++) {
        var n = nextItem(i);
        shown[i] = n.it.id;
        (function (idx, x) { setTimeout(function () { setSlot(idx, x.it, false); }, idx * 350); })(i, n);
      }
    }

    function rotate() {
      var idx = slotTurn % slots.length;
      var n = nextItem(idx);
      setSlot(idx, n.it, n.isNew);
      slotTurn++;
    }

    function lightBulbs(count) {
      var lit = Math.min(40, count);
      for (var i = 0; i < 40; i++) {
        var el = document.getElementById('bulb' + i);
        if (el) el.classList.toggle('lit', i < lit);
      }
    }

    function poll() {
      Api.rpc('tree_data').then(function (res) {
        document.getElementById('offline').hidden = true;
        if (!res) return;
        document.getElementById('cnt').textContent = res.completed || 0;
        if (res.subtitle) document.getElementById('h-title').textContent = res.subtitle;
        if (res.title) document.getElementById('h-sub').textContent = res.title;
        (res.places || []).forEach(function (p) { THEMES[p.no] = String(p.title || '').split('·')[0].trim(); });
        var list = res.shares || [], fresh = [];
        list.forEach(function (it) { if (!seen[it.id]) { seen[it.id] = true; if (!firstLoad) fresh.push(it); } });
        items = list;
        lightBulbs(items.length);
        fresh.reverse().forEach(function (it) { queue.push(it); });
        if (firstLoad) { firstLoad = false; fillAll(); }
        else if (fresh.length) rotate();
      }).catch(function () { document.getElementById('offline').hidden = false; });
    }

    buildSlots();
    poll();
    setInterval(poll, 12000);     // 12초마다 새 나눔 확인
    setInterval(rotate, 7000);    // 7초마다 한 자리씩 다른 나눔으로 교체

    /* 전체화면 + 화면 꺼짐 방지 */
    var fs = document.getElementById('fs');
    fs.onclick = function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      try {
        var p = req && req.call(el);
        if (p && p.catch) p.catch(function () { console.log('fullscreen'); });
        else if (!req) console.log('fullscreen');
      } catch (e) { console.log('fullscreen'); }
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
      fs.hidden = true;
      setTimeout(function () { fs.hidden = false; fs.style.opacity = '.25'; }, 4000);
    };
  })();
  </script>
</body>
</html>
